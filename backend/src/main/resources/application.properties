spring.application.name=banco-semillas-api
server.port=8080

# XAMPP / MariaDB. Ajusta usuario, contrasena o puerto si tu instalacion difiere.
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:banco_semillas}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT: clave de demostracion para ejecucion local. Sobrescribir con JWT_SECRET en despliegue.
app.jwt.secret=${JWT_SECRET:QmFuY29Db211bml0YXJpb1NlbWlsbGFzLURlbW9TdXBlclNlY3JldEtleS0yMDI2IQ==}
app.jwt.expiration-ms=28800000

# Mensajes de error de API
server.error.include-message=always
