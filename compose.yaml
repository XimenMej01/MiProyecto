
services:

  # BASE DE DATOS
  db:
    image: ${DB_IMAGE}
    container_name: semillas-db
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # BACKEND SPRING BOOT
  backend:
    build:
      context: ./backend
    container_name: semillas-backend
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

  # FRONTEND ANGULAR
  frontend:
    build:
      context: ./frontend
    container_name: semillas-frontend
    restart: unless-stopped

    ports:
      - "4200:80"

    depends_on:
      - backend

volumes:
  db_data:
